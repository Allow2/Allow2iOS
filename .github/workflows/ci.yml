name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        xcode: ['15.4', '16.0']
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build (iOS)
        run: |
          xcodebuild build \
            -scheme Allow2 \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation

      - name: Build (macOS)
        run: |
          xcodebuild build \
            -scheme Allow2 \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation

      - name: Test (iOS)
        run: |
          xcodebuild test \
            -scheme Allow2 \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -skipPackagePluginValidation \
            || echo "No tests yet — build-only validation"
